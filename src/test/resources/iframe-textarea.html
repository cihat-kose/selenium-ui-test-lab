<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iframe and textarea practice</title>
</head>
<body>
<h1>Main page</h1>
<p>The textarea is inside the iframe below.</p>
<iframe id="textarea-frame" title="Textarea example"
        srcdoc="<!doctype html><html lang='en'><meta charset='UTF-8'><body><label for='review'>Review:</label><br><textarea id='review' rows='4' cols='50'>Starting text</textarea></body></html>">
</iframe>
</body>
</html>
