<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shadow DOM practice</title>
</head>
<body>
<consent-panel></consent-panel>
<script>
    class ConsentPanel extends HTMLElement {
        constructor() {
            super();
            const root = this.attachShadow({mode: 'open'});
            root.innerHTML = '<button id="accept" type="button">Accept</button>'
                + '<p id="result" aria-live="polite"></p>';
            root.querySelector('#accept').addEventListener('click', () => {
                root.querySelector('#result').textContent = 'Consent accepted';
            });
        }
    }

    customElements.define('consent-panel', ConsentPanel);
</script>
</body>
</html>
