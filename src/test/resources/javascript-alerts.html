<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Alerts Practice</title>
</head>
<body>
<h1>JavaScript Alerts Practice</h1>
<button id="alert-button" type="button" onclick="showAlert()">Open alert</button>
<button id="confirm-button" type="button" onclick="showConfirm()">Open confirmation</button>
<button id="prompt-button" type="button" onclick="showPrompt()">Open prompt</button>
<button id="timer-alert-button" type="button" onclick="showDelayedAlert()">Open delayed alert</button>
<div id="context-area" style="margin-top: 1rem; padding: 2rem; border: 1px solid; width: 18rem;"
     oncontextmenu="showContextAlert(event)">
    Right-click this area to open a JavaScript alert.
</div>
<p id="result" aria-live="polite"></p>
<script>
    const result = document.querySelector('#result');

    function showAlert() {
        alert('This is a JavaScript alert.');
        result.textContent = 'Alert accepted.';
    }

    function showConfirm() {
        result.textContent = confirm('This is a JavaScript confirmation.')
            ? 'You clicked: OK'
            : 'You clicked: Cancel';
    }

    function showPrompt() {
        const answer = prompt('Enter a short message.');
        result.textContent = answer === null ? 'Prompt cancelled.' : `You entered: ${answer}`;
    }

    function showDelayedAlert() {
        setTimeout(() => {
            alert('This alert appeared after one second.');
            result.textContent = 'Delayed alert accepted.';
        }, 1000);
    }

    function showContextAlert(event) {
        event.preventDefault();
        alert('The context area was right-clicked.');
        result.textContent = 'Context alert accepted.';
    }
</script>
</body>
</html>
