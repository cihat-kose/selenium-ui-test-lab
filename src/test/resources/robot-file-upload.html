<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File selection practice</title>
</head>
<body>
<h1>File selection practice</h1>
<form id="upload-form">
    <label for="upload-file">Choose a file</label>
    <input id="upload-file" type="file" required>
    <p id="selected-file" aria-live="polite">No file selected yet</p>
    <label><input id="terms" type="checkbox" required> I accept the terms</label>
    <button id="submit-upload" type="submit">Submit file</button>
</form>
<p id="upload-status" aria-live="polite"></p>
<script>
    const fileInput = document.getElementById('upload-file');
    fileInput.addEventListener('change', () => {
        document.getElementById('selected-file').textContent = fileInput.files[0]?.name ?? '';
    });
    document.getElementById('upload-form').addEventListener('submit', event => {
        event.preventDefault();
        document.getElementById('upload-status').textContent = 'File selected and form submitted.';
    });
</script>
</body>
</html>
