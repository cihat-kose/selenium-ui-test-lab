name: Build validation

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install stable Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Compile lessons and run local browser smoke tests
        run: ./mvnw -B -ntp -Dselenium.headless=true test

      - name: Run the local WebDriver BiDi smoke test
        run: ./mvnw -B -ntp -Dselenium.headless=true -Dtest=ConsoleLogBidiTest#receivesConsoleMessageFromLocalFixture test
