name: Extended lesson validation

on:
  push:
    branches:
      - qa/extended-lesson-validation
  workflow_dispatch:

jobs:
  all-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install stable Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-chromedriver: true
          install-dependencies: true

      - name: Ensure a virtual desktop is available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run all lesson test classes in a virtual desktop
        env:
          SELENIUM_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a ./mvnw -B -ntp -Dselenium.chrome.binary="$SELENIUM_CHROME_BINARY" -Dtest='*Test' test
